<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keel icon concepts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 560px; box-sizing: border-box; padding: 48px 56px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; background: #FFFFFF; color: #18212F; font-family: Inter, system-ui, sans-serif;">
  <sc-for list="{{concepts}}" as="k" hint-placeholder-count="3">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 28px 20px; border-radius: 16px; background: {{k.bg}};">
      <dc-import name="Icon" variant="red" concept="{{k.id}}" size="{{size}}" hint-size="300px,300px"></dc-import>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <span style="font-size: 17px; font-weight: 600;">{{k.name}}</span>
        <span style="font-size: 13px; color: {{k.tagColor}}; font-weight: {{k.tagWeight}};">{{k.tag}}</span>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const concepts = [
      { id: 'layers', name: 'A · Layered keel', tag: 'Recommended', bg: '#FBEEEC', tagColor: '#C7302A', tagWeight: '600' },
      { id: 'hull', name: 'B · Hull and keel', tag: 'Most literal', bg: '#F6F8FB', tagColor: '#4E5B6D', tagWeight: '400' },
      { id: 'monogram', name: 'C · Keel monogram', tag: 'Letter K', bg: '#F6F8FB', tagColor: '#4E5B6D', tagWeight: '400' }
    ];
    return { concepts, size: 300 };
  }
}
</script>
</body>
</html>
