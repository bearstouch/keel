<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keel — Agents</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: {{t.desk}}; color: {{t.fg}}; font-family: Inter, system-ui, sans-serif; font-size: 13px;">

  <section aria-label="Keel Settings, Agents" style="position: absolute; left: 160px; top: 90px; width: 680px; box-sizing: border-box; display: flex; flex-direction: column; border-radius: 12px; background: {{t.bg}}; box-shadow: 0 18px 48px rgba(0,0,0,{{t.shadowA}}); overflow: hidden;">
    <div style="height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid {{t.hair}};">
      <span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57;"></span>
      <span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E;"></span>
      <span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #28C840;"></span>
      <span style="flex-grow: 1; text-align: center; font-weight: 600; margin-right: 52px;">Agents</span>
    </div>
    <div style="padding: 28px 36px 32px; display: flex; flex-direction: column; gap: 28px;">
      <div style="display: flex; align-items: center; gap: 14px;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 14px; font-weight: 600;">Allow agents to connect (MCP)</span>
          <span style="font-size: 12.5px; color: {{t.muted}};">Running on this Mac only · 127.0.0.1:7778</span>
        </div>
        <span role="switch" aria-checked="true" aria-label="Allow agents to connect" style="width: 38px; height: 22px; border-radius: 11px; background: {{t.accent}}; position: relative; flex-shrink: 0;"><span style="position: absolute; right: 2px; top: 2px; width: 18px; height: 18px; border-radius: 50%; background: {{t.knob}};"></span></span>
      </div>

      <div style="display: flex; flex-direction: column;">
        <div style="display: flex; align-items: center; padding-bottom: 10px;">
          <span style="flex-grow: 1; font-size: 14px; font-weight: 600;">Access</span>
          <button type="button" style="height: 30px; padding: 0 12px; border: 0; border-radius: 7px; background: {{t.field}}; color: {{t.fg}}; font: inherit; font-size: 12.5px;">Add agent…</button>
        </div>
        <sc-for list="{{grants}}" as="g" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 12px; height: 56px; border-top: 1px solid {{t.hair}};">
            <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
              <span style="font-weight: 600;">{{g.name}}</span>
              <span style="font-size: 12px; color: {{t.muted}};">{{g.summary}}</span>
            </div>
            <span style="font-size: 12px; color: {{g.statusColor}};">{{g.status}}</span>
            <button type="button" aria-label="{{g.menuLabel}}" style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: {{t.muted}};">
              <svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><circle cx="3.5" cy="8" r="1.3"></circle><circle cx="8" cy="8" r="1.3"></circle><circle cx="12.5" cy="8" r="1.3"></circle></svg>
            </button>
          </div>
        </sc-for>
      </div>

      <a href="#" style="align-self: flex-start; color: {{t.accent}}; text-decoration: none; font-size: 12.5px;">Copy setup command for Claude Code</a>
    </div>
  </section>

  <aside role="alertdialog" aria-labelledby="apTitle" style="position: absolute; left: 900px; top: 90px; width: 380px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 24px 26px; border-radius: 14px; background: {{t.bg}}; box-shadow: 0 18px 48px rgba(0,0,0,{{t.shadowA}});">
    <h2 id="apTitle" style="margin: 0; font-size: 16px; font-weight: 600;">Allow this agent request?</h2>
    <p style="margin: 0; font-size: 13.5px; line-height: 1.55; color: {{t.muted}};"><strong style="color: {{t.fg}}; font-weight: 600;">nightly-cleanup</strong> wants to delete about 2.1 million keys matching <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; color: {{t.fg}};">tmp:import:*</span> on api-staging.</p>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: {{t.muted}};">Type the pattern to allow
      <input type="text" value="tmp:import:*" style="height: 36px; box-sizing: border-box; padding: 0 12px; border: 0; border-radius: 8px; background: {{t.field}}; color: {{t.fg}}; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px;">
    </label>
    <div style="display: flex; gap: 10px; justify-content: flex-end;">
      <button type="button" style="height: 34px; padding: 0 16px; border: 0; border-radius: 8px; background: {{t.field}}; color: {{t.fg}}; font: inherit; font-size: 13px;">Deny</button>
      <button type="button" style="height: 34px; padding: 0 16px; border: 0; border-radius: 8px; background: {{t.danger}}; color: {{t.onDanger}}; font: inherit; font-size: 13px; font-weight: 600;">Allow once</button>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const t = dark ? {
      desk: '#141414', bg: '#2A2A2C', fg: '#E5E5E7', muted: '#A1A1A6', hair: '#3A3A3C', field: '#38383A', shadowA: '0.6',
      accent: '#FF6F61', knob: '#2A0B08', success: '#8DDAA4', warning: '#F2CC7A', danger: '#FFA4A4', onDanger: '#2A0E12'
    } : {
      desk: '#E4E9F0', bg: '#FFFFFF', fg: '#18212F', muted: '#4E5B6D', hair: '#E3E8EE', field: '#F1F4F8', shadowA: '0.14',
      accent: '#C7302A', knob: '#FFFFFF', success: '#216B3B', warning: '#805400', danger: '#B22D32', onDanger: '#FFFFFF'
    };
    const grants = [
      { name: 'Claude Code', summary: 'Read and write · local-dev, api-staging', status: 'Connected', statusColor: t.success },
      { name: 'nightly-cleanup', summary: 'Read and delete · api-staging', status: 'Waiting for you', statusColor: t.warning }
    ].map((g) => ({ ...g, menuLabel: 'More options for ' + g.name }));
    return { t, grants };
  }
}
</script>
</body>
</html>
