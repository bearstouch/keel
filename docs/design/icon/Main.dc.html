<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keel app icon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 56px; background: #FBEEEC; color: #18212F; font-family: Inter, system-ui, sans-serif;">
  <dc-import name="Icon" variant="red" concept="layers" size="{{big}}" hint-size="460px,460px"></dc-import>
  <div style="display: flex; flex-direction: column; gap: 14px;">
    <h1 style="margin: 0; font-size: 128px; font-weight: 700; letter-spacing: -0.045em; line-height: 1;">Keel</h1>
    <p style="margin: 0; font-size: 24px; color: #4E5B6D;">A calm Redis client for macOS</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return { big: 460 }; }
}
</script>
</body>
</html>
