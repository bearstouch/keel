name: CI

on:
  pull_request:
    branches: [master]
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-test:
    name: Lint, build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # Actions are pinned to commit SHAs (NFR-SC07); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          swift --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-

      - name: Lint
        run: |
          # `bash -e` would exit on the failing assignment before printing the findings, so capture the status.
          status=0; out=$(swift format lint --strict -r Sources Tests ThirdParty 2>&1) || status=$?
          if [ "$status" -ne 0 ] || [ -n "$out" ]; then echo "$out"; echo "::error::swift format lint reported issues; run 'swift format -i -r Sources Tests ThirdParty'"; exit 1; fi

      - name: Build
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log
          # Sources must stay warning-free (NFR-QA01). Vendored code compiles through Sources/<Target>/TrellisShared, so it is checked too.
          if grep -E '/Sources/[^ ]*: warning:' build.log; then
            echo "::error::Build produced warnings in project sources"; exit 1
          fi

      - name: Test
        run: swift test

      # A test process that crashes prints only the runtime's message; its crash report has the stack.
      - name: Crash reports
        if: failure()
        run: |
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/xctest*.ips 2>/dev/null | head -2); do echo "== $f"; cat "$f"; done

  # NFR-QA03 / KEEL-048: KeelIntegrationTests against the pinned container matrix (Tests/Fixtures/Integration/matrix.json).
  # Apple-silicon runners can't run a Linux VM (no nested virtualization), so this job uses the Intel image with Colima.
  integration:
    name: Integration matrix
    runs-on: macos-15-intel
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          swift --version

      - name: Start Docker (Colima)
        run: |
          brew install docker colima
          colima start --cpu 3 --memory 8 --disk 30
          docker info --format 'Docker {{.ServerVersion}} on {{.OperatingSystem}} ({{.Architecture}})'

      - name: Integration matrix
        run: python3 -I scripts/integration-matrix.py

      - name: Evidence
        if: always()
        run: cat .build/integration/evidence.json 2>/dev/null || echo "no evidence written"
