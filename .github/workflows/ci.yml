name: CI

on:
  pull_request:
    branches: [master]
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-test:
    name: Lint, build and test
    # Xcode 27.1 / Swift 6.4 (a GitHub preview image on macOS 27): test runs built by Xcode 26.3–26.6 on macos-26 abort
    # in the concurrency runtime ("freed pointer was not the last allocation"), which no local build reproduced.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      # Actions are pinned to commit SHAs (NFR-SC07); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned: on this image the Xcode_27.2 names point at a release candidate.
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          swift --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-${{ runner.os }}-xcode27.1-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: spm-${{ runner.os }}-xcode27.1-${{ hashFiles('Package.swift', 'Package.resolved') }}-

      - name: Lint
        run: |
          # `bash -e` would exit on the failing assignment before printing the findings, so capture the status.
          status=0; out=$(swift format lint --strict -r Sources Tests ThirdParty 2>&1) || status=$?
          if [ "$status" -ne 0 ] || [ -n "$out" ]; then echo "$out"; echo "::error::swift format lint reported issues; run 'swift format -i -r Sources Tests ThirdParty'"; exit 1; fi

      - name: Build
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log
          # Sources must stay warning-free (NFR-QA01). Vendored code compiles through Sources/<Target>/TrellisShared, so it is checked too.
          if grep -E '/Sources/[^ ]*: warning:' build.log; then
            echo "::error::Build produced warnings in project sources"; exit 1
          fi

      - name: Test
        # A crashing test process otherwise prints only the runtime's message; the backtracer prints its stack.
        env:
          SWIFT_BACKTRACE: enable=yes,interactive=no,sanitize=no,threads=all
        run: swift test

      # The backtracer stops at the first frame on an abort in the concurrency runtime: rerun the crashing class under
      # lldb, which prints every thread's stack when the process stops.
      - name: Crash backtrace
        if: failure()
        run: |
          lldb --batch -o run -k 'thread backtrace all' -k 'kill' -- "$(xcrun -f xctest)" \
            -XCTest KeelUITests.AccessibilityAuditTests .build/arm64-apple-macosx/debug/KeelPackageTests.xctest || true

  # NFR-QA03 / KEEL-048: KeelIntegrationTests against the pinned container matrix (Tests/Fixtures/Integration/matrix.json).
  # Apple-silicon runners can't run a Linux VM (no nested virtualization), so this job uses the Intel image with Colima.
  integration:
    name: Integration matrix
    runs-on: macos-15-intel
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          swift --version

      - name: Start Docker (Colima)
        run: |
          brew install docker colima
          colima start --cpu 3 --memory 8 --disk 30
          docker info --format 'Docker {{.ServerVersion}} on {{.OperatingSystem}} ({{.Architecture}})'

      - name: Integration matrix
        run: python3 -I scripts/integration-matrix.py

      - name: Evidence
        if: always()
        run: cat .build/integration/evidence.json 2>/dev/null || echo "no evidence written"
